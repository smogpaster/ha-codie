say:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: codie
    text:
      required: true
      example: "Das Licht im Wohnzimmer ist aus."
      selector:
        text:
          multiline: true
    wait:
      default: false
      selector:
        boolean:

notify:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: codie
    text:
      required: true
      example: "Die Waschmaschine ist fertig."
      selector:
        text:

show_image:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: codie
    url:
      example: "https://example.com/bild.jpg"
      selector:
        text:
          type: url
    path:
      example: "/config/www/codie/bild.png"
      selector:
        text:
    duration:
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    fit:
      default: contain
      selector:
        select:
          translation_key: fit
          options:
            - contain
            - cover
            - stretch
